language = "C"
header = "// ABOUTME: Generated C header for the helix-diff Rust library.\n// ABOUTME: Provides line-level, character-level, and 3-way merge diff functions."
include_guard = "HELIX_DIFF_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify. */"

[export]
include = [
    "DiffResult",
    "DiffHunk",
    "DiffLine",
    "InlineResult",
    "InlineChunk",
    "MergeResult",
]
exclude = [
    "libc_malloc",
    "libc_free",
]
