name: Helix
options:
  bundleIdPrefix: com.hexul
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"
  xcodeVersion: "16.0"

packages:
  MutagenKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"

targets:
  Helix:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MutagenKit
        product: MutagenKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexul.Helix
        PRODUCT_NAME: Helix
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Helix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Helix
        CFBundleName: Helix
        CFBundleShortVersionString: "2026.2.0"
        CFBundleVersion: "1"
        SUFeedURL: "https://raw.githubusercontent.com/hex/Helix/main/appcast.xml"
